<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chitkara Campus Hole Game</title>
<style>
  body { margin:0; overflow:hidden; font-family: Arial, sans-serif; background:#87ceeb; }
  #hud { position:fixed; top:10px; left:10px; right:10px; display:flex; gap:10px; z-index:10; pointer-events:none; }
  .pill { background:rgba(0,0,0,.75); color:#fff; padding:8px 14px; border-radius:20px; font-weight:bold; }
  #help { position:fixed; bottom:10px; left:10px; background:rgba(0,0,0,.65); color:#fff; padding:8px 12px; border-radius:10px; font-size:13px; z-index:10; }
  #over { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); z-index:20; }
  #over div { background:#fff; padding:24px; border-radius:14px; text-align:center; max-width:320px; }
  button { padding:10px 18px; font-size:16px; border:0; border-radius:8px; background:#000; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<div id="hud">
  <div class="pill">Score: <span id="score">0</span></div>
  <div class="pill">Hole: <span id="size">1.5</span>m</div>
  <div class="pill">Time: <span id="time">120</span>s</div>
  <div class="pill">Eaten: <span id="eaten">0</span></div>
</div>
<div id="help">WASD / Arrow keys or drag to move the hole &bull; Eat small things first, grow, then eat the Academic Block!</div>
<div id="over"><div><h2 id="overTitle">Time up!</h2><p id="overText"></p><button onclick="location.reload()">Play again</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Chitkara Campus Hole Game — Step 2: base map + Academic Block
// Real campus: 17 acres, Atal Shiksha Kunj, Barotiwala, Baddi, HP.
// Step 3: first car added below. Kalam Block, Tagore Library, hostels, bus come one by one after that.
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 90, 180);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(30, 60, 20); sun.castShadow = true;
scene.add(sun);

// Ground — compact campus, like the real one
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 80), new THREE.MeshLambertMaterial({color:0x6ab04c}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
// Roads
function road(w,d,x,z){ const r=new THREE.Mesh(new THREE.PlaneGeometry(w,d), new THREE.MeshLambertMaterial({color:0x444444})); r.rotation.x=-Math.PI/2; r.position.set(x,0.02,z); scene.add(r); }
road(120,6,0,0); road(6,80,0,0);

function label(text){
  const c=document.createElement('canvas'); c.width=512; c.height=128;
  const g=c.getContext('2d'); g.fillStyle='rgba(0,0,0,0.75)'; g.fillRect(0,0,512,128);
  g.fillStyle='#fff'; g.font='bold 44px Arial'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,256,64);
  const t=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t}));
  s.scale.set(16,4,1); return s;
}
function building(name,x,z,w,h,d,color){
  const grp=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color}));
  body.position.y=h/2; body.castShadow=true; grp.add(body);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(w+1,0.6,d+1), new THREE.MeshLambertMaterial({color:0x8b0000}));
  roof.position.y=h+0.3; grp.add(roof);
  // windows
  const winMat=new THREE.MeshLambertMaterial({color:0x223344});
  for(let i=0;i<4;i++) for(let j=0;j<2;j++){
    const win=new THREE.Mesh(new THREE.PlaneGeometry(2,1.4), winMat);
    win.position.set(-w/2+3+i*4.5, 2.5+j*3, d/2+0.06); grp.add(win);
  }
  const lab=label(name); lab.position.y=h+4; grp.add(lab);
  grp.position.set(x,0,z); scene.add(grp); return grp;
}

const eatables=[];
function addEatable(mesh,size,score,name){
  mesh.userData={size,score,name}; eatables.push(mesh); scene.add(mesh);
}

// Step 2 building: Academic Block
const academic = building('ACADEMIC BLOCK', -25, -12, 20, 9, 12, 0xe8dcc3);
addEatable(academic, 9, 500, 'Academic Block');

// Step 4: Kalam Block — gym is inside it
const kalam = building('KALAM BLOCK', 25, -12, 18, 8, 12, 0xdfe6e9);
addEatable(kalam, 8, 450, 'Kalam Block');

// Step 5: Tagore Library — 3-storey, reading hall 9am-9pm, 395 seats
const tagore = building('TAGORE LIBRARY', -25, 18, 16, 10, 10, 0xf5e6c8);
addEatable(tagore, 9, 500, 'Tagore Library');

// Step 6: Hostels — Bose (2nd year+, 5 floors) and Aryabhatta (1st year, 5 floors)
const bose = building('BOSE HOSTEL', 40, -25, 14, 12, 10, 0xffeaa7);
addEatable(bose, 10, 550, 'Bose Hostel');
const aryabhatta = building('ARYABHATTA HOSTEL', -42, 24, 14, 12, 10, 0x74b9ff);
addEatable(aryabhatta, 10, 550, 'Aryabhatta Hostel');

// Small eatables: trees, benches, dustbins
function tree(x,z){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,1.5,8), new THREE.MeshLambertMaterial({color:0x8b5a2b}));
  trunk.position.y=0.75; g.add(trunk);
  const top=new THREE.Mesh(new THREE.ConeGeometry(1.4,3,8), new THREE.MeshLambertMaterial({color:0x228b22}));
  top.position.y=3; top.castShadow=true; g.add(top);
  g.position.set(x,0,z); addEatable(g,1.5,10,'Tree');
}
function bench(x,z){
  const g=new THREE.Group();
  const seat=new THREE.Mesh(new THREE.BoxGeometry(2,0.2,0.8), new THREE.MeshLambertMaterial({color:0x8b4513}));
  seat.position.y=0.5; g.add(seat);
  g.position.set(x,0,z); addEatable(g,1,5,'Bench');
}
function bin(x,z){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.4,1,10), new THREE.MeshLambertMaterial({color:0x2f7d32}));
  m.position.set(x,0.5,z); addEatable(m,0.8,5,'Dustbin');
}
tree(-10,-18); tree(8,-20); tree(20,-8); tree(-8,14); tree(15,18); tree(28,10); tree(-35,15); tree(5,5);
bench(-12,8); bench(12,-12); bench(22,16);
bin(-5,-5); bin(18,2); bin(-18,18);

// Step 3: first car — parked on the road, outside the campus like the real one
function car(x,z,color){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(3.6,0.9,1.8), new THREE.MeshLambertMaterial({color}));
  body.position.y=0.7; body.castShadow=true; g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(2,0.8,1.6), new THREE.MeshLambertMaterial({color:0x222222}));
  cabin.position.set(-0.2,1.5,0); g.add(cabin);
  const wheelMat=new THREE.MeshLambertMaterial({color:0x111111});
  [[-1.2,0.9],[1.2,0.9],[-1.2,-0.9],[1.2,-0.9]].forEach(p=>{
    const w=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.3,12), wheelMat);
    w.rotation.x=Math.PI/2; w.position.set(p[0],0.4,p[1]); g.add(w);
  });
  g.position.set(x,0,z); addEatable(g,2.5,50,'Car');
}
car(10, 3, 0xff0000);

// Step 7: university bus — yellow, on the road outside the gate
function bus(x,z,color){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(8,2.2,2.4), new THREE.MeshLambertMaterial({color}));
  body.position.y=1.4; body.castShadow=true; g.add(body);
  const winMat=new THREE.MeshLambertMaterial({color:0x223344});
  for(let i=0;i<4;i++){
    const win=new THREE.Mesh(new THREE.PlaneGeometry(1.4,0.9), winMat);
    win.position.set(-3+i*2, 1.8, 1.21); g.add(win);
  }
  const wheelMat=new THREE.MeshLambertMaterial({color:0x111111});
  [[-2.5,1.2],[2.5,1.2],[-2.5,-1.2],[2.5,-1.2]].forEach(p=>{
    const w=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.35,12), wheelMat);
    w.rotation.x=Math.PI/2; w.position.set(p[0],0.55,p[1]); g.add(w);
  });
  g.position.set(x,0,z); addEatable(g,4,150,'Bus');
}
bus(-15, 0, 0xffcc00);

// Step 8: real campus photo billboard — first real photo in the game.
// Photo: Chitkara University Baddi campus, main building + bridge.
// Source: https://zollege.in/university/184873-chitkara-university-solan
// This is a public web photo, not a photo taken on campus. For a GTA-style
// real look, the best photos are the ones Tripathi takes himself on campus,
// one front photo per building — those will replace these billboards one by one.
const photoLoader = new THREE.TextureLoader();
photoLoader.setCrossOrigin('anonymous');
const photoMat = new THREE.SpriteMaterial({color:0xcccccc});
const photoBillboard = new THREE.Sprite(photoMat);
photoBillboard.scale.set(18, 8, 1);
photoBillboard.position.set(0, 5, -25);
scene.add(photoBillboard);
photoLoader.load(
  'https://static.zollege.in/public/college_data/images/campusimage/17473099531463566740campus1.jpeg?tr=h-313,w-700,c-force',
  function(tex){ photoMat.map = tex; photoMat.color.set(0xffffff); photoMat.needsUpdate = true; },
  undefined,
  function(){ /* photo failed to load (offline / blocked) — keep grey billboard, game still works */ }
);
const photoLabel = label('REAL PHOTO - CHITKARA UNIVERSITY');
photoLabel.position.set(0, 10, -25); photoLabel.scale.set(14, 3.5, 1);
scene.add(photoLabel);

// Step 9: Gargi Hostel — real photo found, same HP campus.
// Photo: Gargi Hostel exterior, beige 5-floor building, "GARGI hostel" in red.
// Source: CollegeDekho, Chitkara University Himachal Pradesh campus page.
// https://www.collegedekho.com/colleges/chitkara-university-himachal-pradesh/campus
// Note: this is Gargi Hostel, NOT Bose/Aryabhatta — labelled correctly.
// The second hostel photo found was a hostel ROOM interior (beds/desks),
// not a building exterior, so it is not used as a building photo.
const gargi = building('GARGI HOSTEL', -42, -20, 14, 12, 10, 0xe8dcc3);
addEatable(gargi, 10, 550, 'Gargi Hostel');
const gargiMat = new THREE.SpriteMaterial({color:0xcccccc});
const gargiPhoto = new THREE.Sprite(gargiMat);
gargiPhoto.scale.set(12, 8, 1);
gargiPhoto.position.set(-42, 5, -13);
scene.add(gargiPhoto);
photoLoader.load(
  'https://media.collegedekho.com/media/cms/ck5/chitkara%20hostel%201%20.jpg',
  function(tex){ gargiMat.map = tex; gargiMat.color.set(0xffffff); gargiMat.needsUpdate = true; },
  undefined,
  function(){ /* photo failed — keep grey billboard, game still works */ }
);

// Step 10: Tripathi's own photos — panorama (May 2016, Google Maps) + bridge.
// These two files live in photos/ next to index.html:
//   photos/campus-panorama-may2016.jpg — wide panorama, main buildings + CHITKARA UNIVERSITY bridge, cars parked
//   photos/campus-bridge.jpg — the CHITKARA UNIVERSITY walkway/bridge, front view
// NOTE: binary photo files cannot be pushed by Muse's GitHub connector (it only
// pushes text files), so the photos must be uploaded once via the GitHub website
// into the photos/ folder — then these relative paths load in the game.
// Until then the billboards stay grey; the game still works.
function userPhotoBillboard(relPath, x, y, z, w, h, labelText){
  const mat = new THREE.SpriteMaterial({color:0xcccccc});
  const spr = new THREE.Sprite(mat);
  spr.scale.set(w, h, 1); spr.position.set(x, y, z); scene.add(spr);
  const lab = label(labelText); lab.position.set(x, y + h/2 + 2, z); lab.scale.set(14, 3.5, 1); scene.add(lab);
  photoLoader.load(relPath,
    function(tex){ mat.map = tex; mat.color.set(0xffffff); mat.needsUpdate = true; },
    undefined, function(){ /* photo file not in repo yet — grey billboard, game still works */ });
  return spr;
}
userPhotoBillboard('photos/campus-panorama-may2016.jpg', 0, 6, -32, 30, 11, 'YOUR PHOTO - CAMPUS PANORAMA');
userPhotoBillboard('photos/campus-bridge.jpg', 25, 5, 2, 14, 9, 'YOUR PHOTO - CHITKARA BRIDGE');

// Step 11: Cricket Ground — confirmed by Tripathi (his "h" = haan, 2026-11-12 13:22 IST).
// Google Maps satellite labels it north of the main cluster, NE of it is Bose Hostel.
// No ground-level front photo of it was found on Maps, so it is a flat green oval
// with a brown pitch strip, not a photo billboard. Placement is approximate.
const cricket = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshLambertMaterial({color:0x4caf50}));
cricket.rotation.x = -Math.PI/2; cricket.scale.set(14, 9, 1); cricket.position.set(0, 0.03, -36); scene.add(cricket);
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(10, 2), new THREE.MeshLambertMaterial({color:0x8b5a2b}));
pitch.rotation.x = -Math.PI/2; pitch.position.set(0, 0.04, -36); scene.add(pitch);
const cricketLabel = label('CRICKET GROUND');
cricketLabel.position.set(0, 2, -36); cricketLabel.scale.set(14, 3.5, 1); scene.add(cricketLabel);

// Step 12: REAL PHOTO — Gandhi Block + Kalam Block, front view.
// Photo: Collegedunia review photo, Feb 2023 (IMG_20230225_133850).
// Left building reads "GANDHI block" with the Indian flag on top;
// right building reads "KALAM block" on its roof; campus cart + cars in front.
// This is the first real front photo of Kalam Block — Maps only had its side wall.
// Source: https://collegedunia.com/university/25552-chitkara-university-solan
// Note: Collegedunia sends no Access-Control-Allow-Origin header, so in some
// browsers this billboard may stay grey — same limit as the Step 8 photo.
const kalamMat = new THREE.SpriteMaterial({color:0xcccccc});
const kalamPhoto = new THREE.Sprite(kalamMat);
kalamPhoto.scale.set(16, 10, 1);
kalamPhoto.position.set(25, 5, -19);
scene.add(kalamPhoto);
photoLoader.load(
  'https://image-static.collegedunia.com/public/reviewPhotos/365895/IMG_20230225_133850.jpg',
  function(tex){ kalamMat.map = tex; kalamMat.color.set(0xffffff); kalamMat.needsUpdate = true; },
  undefined,
  function(){ /* photo failed — keep grey billboard, game still works */ }
);
const kalamLabel = label('REAL PHOTO - GANDHI + KALAM BLOCK');
kalamLabel.position.set(25, 11, -19); kalamLabel.scale.set(16, 4, 1); scene.add(kalamLabel);

// Step 13: Pharma Block + full Sports Zone, one complete feature commit.
// (Tripathi's feedback 2026-11-12: one tiny thing per commit is not proper
// contributing — from now on, complete features per commit, not single items.)
// Pharma Block (east side), Football Ground, Basketball Court, Volleyball
// Court and a Chess area — all verified campus sports, placement approximate.
const pharma = building('PHARMA BLOCK', 42, 12, 16, 9, 10, 0xffeaa7);
addEatable(pharma, 9, 500, 'Pharma Block');
// Football ground — green oval with a white centre line
const football = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshLambertMaterial({color:0x2e8b57}));
football.rotation.x = -Math.PI/2; football.scale.set(13, 7, 1); football.position.set(-15, 0.03, 33); scene.add(football);
const fLine = new THREE.Mesh(new THREE.PlaneGeometry(1, 14), new THREE.MeshLambertMaterial({color:0xffffff}));
fLine.rotation.x = -Math.PI/2; fLine.position.set(-15, 0.04, 33); scene.add(fLine);
const fLabel = label('FOOTBALL GROUND'); fLabel.position.set(-15, 2, 33); fLabel.scale.set(14, 3.5, 1); scene.add(fLabel);
// Basketball court — orange rectangle with a centre line
const basket = new THREE.Mesh(new THREE.PlaneGeometry(12, 7), new THREE.MeshLambertMaterial({color:0xe67e22}));
basket.rotation.x = -Math.PI/2; basket.position.set(35, 0.03, 30); scene.add(basket);
const bLine = new THREE.Mesh(new THREE.PlaneGeometry(1, 7), new THREE.MeshLambertMaterial({color:0xffffff}));
bLine.rotation.x = -Math.PI/2; bLine.position.set(35, 0.04, 30); scene.add(bLine);
const bLabel = label('BASKETBALL COURT'); bLabel.position.set(35, 2, 30); bLabel.scale.set(14, 3.5, 1); scene.add(bLabel);
// Volleyball court — sand-coloured rectangle
const volley = new THREE.Mesh(new THREE.PlaneGeometry(10, 6), new THREE.MeshLambertMaterial({color:0xf5deb3}));
volley.rotation.x = -Math.PI/2; volley.position.set(8, 0.03, 33); scene.add(volley);
const vLabel = label('VOLLEYBALL COURT'); vLabel.position.set(8, 2, 33); vLabel.scale.set(14, 3.5, 1); scene.add(vLabel);
// Chess area — board + 4 pieces
const board = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshLambertMaterial({color:0xdddddd}));
board.rotation.x = -Math.PI/2; board.position.set(-5, 0.03, 20); scene.add(board);
[[-7,18,0x111111],[-3,18,0xffffff],[-7,22,0xffffff],[-3,22,0x111111]].forEach(function(p){
  const piece = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.6,1.2,10), new THREE.MeshLambertMaterial({color:p[2]}));
  piece.position.set(p[0], 0.6, p[1]); scene.add(piece); addEatable(piece, 1, 10, 'Chess piece');
});
const cLabel = label('CHESS AREA'); cLabel.position.set(-5, 2, 20); cLabel.scale.set(10, 2.5, 1); scene.add(cLabel);

// Step 14: Gandhi Block — seen in the Step 12 real photo (left building,
// "GANDHI block" in red, Indian flag on top), between Academic and Kalam.
const gandhi = building('GANDHI BLOCK', 0, -12, 16, 8, 12, 0xe8dcc3);
addEatable(gandhi, 8, 450, 'Gandhi Block');

// Step 15: Kalpana Hostel — satellite/map label, NW of the cricket ground,
// next to Gargi Hostel. No front photo found on Maps for it.
const kalpana = building('KALPANA HOSTEL', -42, -32, 12, 11, 10, 0xf5e6c8);
addEatable(kalpana, 10, 550, 'Kalpana Hostel');

// Step 16: Culinary Arts — Chitkara School of Culinary Arts, front entrance
// seen in the May 2018 Street View 360 photo (name on the building itself).
const culinary = building('CULINARY ARTS', 42, -8, 12, 7, 8, 0x74b9ff);
addEatable(culinary, 7, 400, 'Culinary Arts');

// The hole
let holeRadius=1.5;
const hole=new THREE.Mesh(new THREE.CircleGeometry(1,48), new THREE.MeshBasicMaterial({color:0x000000}));
hole.rotation.x=-Math.PI/2; hole.position.set(0,0.06,10); scene.add(hole);
const ring=new THREE.Mesh(new THREE.RingGeometry(1,1.15,48), new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2; ring.position.y=0.07; scene.add(ring);
function updateHole(){ hole.scale.set(holeRadius,holeRadius,1); ring.scale.set(holeRadius,holeRadius,1); ring.position.set(hole.position.x,0.07,hole.position.z); }
updateHole();

// Controls: WASD / arrows + mouse / touch drag
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let target=null;
function pointerGround(e){
  const x=(e.clientX/innerWidth)*2-1, y=-(e.clientY/innerHeight)*2+1;
  const v=new THREE.Vector3(x,y,0.5).unproject(camera);
  const dir=v.sub(camera.position).normalize();
  const t=-camera.position.y/dir.y;
  return new THREE.Vector3(camera.position.x+dir.x*t,0,camera.position.z+dir.z*t);
}
addEventListener('pointerdown',e=>{ target=pointerGround(e); });
addEventListener('pointermove',e=>{ if(e.buttons) target=pointerGround(e); });
addEventListener('pointerup',()=>target=null);

let score=0, eatenCount=0, timeLeft=120, over=false;
const scoreEl=document.getElementById('score'), sizeEl=document.getElementById('size'),
      timeEl=document.getElementById('time'), eatenEl=document.getElementById('eaten');
function endGame(title){
  over=true;
  document.getElementById('overTitle').textContent=title;
  document.getElementById('overText').textContent='Score: '+score+' • Eaten: '+eatenCount+' • Hole size: '+holeRadius.toFixed(1)+'m';
  document.getElementById('over').style.display='flex';
}
setInterval(()=>{ if(!over){ timeLeft--; timeEl.textContent=timeLeft; if(timeLeft<=0) endGame('Time up!'); } },1000);

function animate(){
  requestAnimationFrame(animate);
  if(!over){
    const sp=0.35;
    if(keys['w']||keys['arrowup']) hole.position.z-=sp;
    if(keys['s']||keys['arrowdown']) hole.position.z+=sp;
    if(keys['a']||keys['arrowleft']) hole.position.x-=sp;
    if(keys['d']||keys['arrowright']) hole.position.x+=sp;
    if(target){
      const dx=target.x-hole.position.x, dz=target.z-hole.position.z;
      const d=Math.hypot(dx,dz);
      if(d>0.3){ hole.position.x+=dx/d*sp; hole.position.z+=dz/d*sp; }
    }
    hole.position.x=Math.max(-58,Math.min(58,hole.position.x));
    hole.position.z=Math.max(-38,Math.min(38,hole.position.z));
    updateHole();
    // Eat check
    for(let i=eatables.length-1;i>=0;i--){
      const m=eatables[i], s=m.userData.size;
      const dx=m.position.x-hole.position.x, dz=m.position.z-hole.position.z;
      if(Math.hypot(dx,dz) < holeRadius + s*0.4 && s <= holeRadius*1.3){
        scene.remove(m); eatables.splice(i,1);
        score+=m.userData.score; eatenCount++;
        holeRadius=Math.min(12,holeRadius + s*0.06);
        scoreEl.textContent=score; eatenEl.textContent=eatenCount;
        sizeEl.textContent=holeRadius.toFixed(1);
        if(m.userData.name==='Academic Block') endGame('You ate the Academic Block!');
      }
    }
    camera.position.set(hole.position.x, 42, hole.position.z+32);
    camera.lookAt(hole.position.x, 0, hole.position.z);
  }
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
